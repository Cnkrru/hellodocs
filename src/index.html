<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 站点图标：SVG 优先（现代浏览器），ico 兜底（老浏览器/兼容），apple-touch-icon 供 iOS 添加到主屏 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      刻意不留 title 标签：本文件是引擎模板，随包发布，读不到用户侧的 hd.config.ts，
      写死站名会与配置的 title 不一致（每个页面都会顶着那个写死的名字）。
      标题与描述统一由 theme 的 useSeo 经 unhead 注入，SSG 预渲染与客户端都是它。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/theme/main.ts"></script>
  </body>
</html>
